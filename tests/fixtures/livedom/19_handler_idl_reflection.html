<!doctype html><html><head><title>handler idl reflection</title></head><body>
<div id="src1" onmouseover="this.setAttribute('data-hov','1')">src1</div>
<button id="src2" onclick="document.getElementById('o1').textContent='src2 ran'">src2</button>
<div id="o1">-</div>
<div id="o2">-</div>
<div id="o3">-</div>
<div id="o4">-</div>
<div id="o5">-</div>
<div id="dyn"></div>
<script>
// The event-handler content attribute and the event-handler IDL attribute are
// ONE piece of state. Each row below reads one direction of that.
var out = function (id, s) { document.getElementById(id).textContent = s; };

// (1) content attribute -> IDL attribute, on a SOURCE-parsed element, read
//     BEFORE anything is ever dispatched at it.
var s2 = document.getElementById('src2');
out('o2', typeof s2.onclick);

// (2) a handler name that is NOT one of click/input/change/submit, installed by
//     setAttribute on a node created after parse.
var d = document.createElement('div');
d.id = 'made';
d.setAttribute('onmouseover', "document.getElementById('o3').textContent='mouseover ran'");
d.setAttribute('onkeydown', "document.getElementById('o4').textContent='keydown ran'");
d.textContent = 'made';
document.getElementById('dyn').appendChild(d);

// (3) IDL attribute assignment must WIN over an earlier content attribute, and
//     removeAttribute must un-install the handler entirely.
var s1 = document.getElementById('src1');
var b = document.createElement('button');
b.id = 'made2';
b.setAttribute('onclick', "document.getElementById('o5').textContent='WRONG';");
b.onclick = function () { document.getElementById('o5').textContent = 'idl won'; };
b.textContent = 'made2';
document.getElementById('dyn').appendChild(b);

var b2 = document.createElement('button');
b2.id = 'made3';
b2.setAttribute('onclick', "document.getElementById('o5').textContent='REMOVED HANDLER RAN';");
b2.removeAttribute('onclick');
b2.textContent = 'made3';
document.getElementById('dyn').appendChild(b2);
d.setAttribute('data-onclick-after-remove', String(b2.onclick));

window.__act = function () {
  document.getElementById('src2').click();
  document.getElementById('made2').click();
  document.getElementById('made3').click();
  document.getElementById('made').dispatchEvent(new Event('mouseover', {bubbles: true}));
  document.getElementById('made').dispatchEvent(new Event('keydown', {bubbles: true}));
  document.getElementById('src1').dispatchEvent(new Event('mouseover', {bubbles: true}));
};
</script>
</body></html>
